<body style="background:#EEF2F1">
<script>
// Runs once inside the Android app, from the copy of the app built into it: hands the data saved
// there to the app, which then opens the live website (where updates arrive by themselves).
(function () {
  var data = '';
  try { data = localStorage.getItem('content-planner-v1') || ''; } catch (e) {}
  try { GlilaAndroid.keepOldData(data); } catch (e) { location.replace('https://karentti-cpu.github.io/Glila/'); }
})();
</script>
</body>
