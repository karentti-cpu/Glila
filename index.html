<style>
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --ink: #14302E;
  --muted: #55706D;
  --line: #D3DEDC;
  --accent: #1F6F6A;
  --accent-ink: #FFFFFF;
  --sun: #E9A62B;
  --danger: #B3402F;
  --serif: "Frank Ruhl Libre", "Times New Roman", serif;
  --sans: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1C1B; --surface: #172827; --ink: #E6F0EE; --muted: #93ACA8;
    --line: #2A4240; --accent: #5CC4BB; --accent-ink: #0B1B1A; --sun: #F2B544; --danger: #E5806F;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1C1B; --surface: #172827; --ink: #E6F0EE; --muted: #93ACA8;
  --line: #2A4240; --accent: #5CC4BB; --accent-ink: #0B1B1A; --sun: #F2B544; --danger: #E5806F;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { max-width: 560px; margin: 0 auto; padding: 20px 18px 110px; }

.head h1 { font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1.1; margin: 8px 0 4px; }
.head p { margin: 0; color: var(--muted); }

.progress { margin: 18px 0 22px; }
.progress .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.progress .bar span { display: block; height: 100%; background: var(--sun); transition: width .35s ease; }
.progress .txt { margin-top: 8px; font-weight: 600; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px;
}
.row.wrap { flex-wrap: wrap; }
.racts { display: flex; gap: 8px; width: 100%; }
.row.done .title { text-decoration: line-through; color: var(--muted); }
.check {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid var(--accent); background: transparent;
  display: grid; place-items: center; padding: 0;
}
.check svg { width: 18px; height: 18px; opacity: 0; stroke: var(--accent-ink); }
.row.done .check { background: var(--accent); }
.row.done .check svg { opacity: 1; }
.body { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

.btn {
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  border-radius: 999px; padding: 8px 16px; font-weight: 600; min-height: 40px;
}
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 4px 12px; min-height: 34px; font-size: 15px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }

.empty {
  background: var(--surface); border: 1px dashed var(--line); border-radius: 14px;
  padding: 22px 18px;
}
.empty h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; }
.empty p { margin: 0 0 14px; color: var(--muted); }

.done-msg { margin-top: 20px; padding: 16px 18px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-family: var(--serif); font-size: 22px; }

.pick { background: var(--surface); border: 2px solid var(--sun); border-radius: 16px; padding: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }

h2.sec { font-family: var(--serif); font-size: 26px; margin: 28px 0 10px; }
.tag-today { font-family: var(--sans); font-size: 14px; font-weight: 700; margin-inline-start: 10px; background: var(--sun); color: #2A1D00; border-radius: 999px; padding: 2px 10px; vertical-align: middle; }
.none-line { color: var(--muted); margin: 0; font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
input[type=text], input[type=url], select {
  width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px;
  padding: 10px 12px; min-height: 44px; font-weight: 400;
}
input[dir=ltr] { text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 14px; min-height: 38px; font-weight: 600;
}
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 6px; }
.err { color: var(--danger); font-size: 15px; margin: 0; min-height: 1em; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.topic-add { display: flex; gap: 8px; }
.topic-add input { flex: 1; }
.sugg { margin-top: 16px; }
.sugg p { margin: 0 0 8px; color: var(--muted); }

.sg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.sg .name { font-weight: 700; overflow-wrap: anywhere; }
.sg .why { margin: 0; color: var(--muted); font-size: 15px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; font-size: 13px; }
.status { color: var(--muted); margin: 16px 0 0; }
.added { font-weight: 600; color: var(--accent); }
.ans { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bg); border-inline-start: 4px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
}
nav.tabs .in { display: flex; width: 100%; max-width: 560px; gap: 6px; }
nav.tabs button {
  flex: 1; border: 0; background: transparent; border-radius: 12px;
  padding: 8px 4px; min-height: 48px; font-weight: 600; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px;
}
nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current=page] { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

.note { color: var(--muted); font-size: 14px; margin-top: 26px; }

.chip.small { min-height: 32px; padding: 2px 12px; font-size: 14px; }
.langbar { display: flex; gap: 6px; justify-content: flex-end; margin: -6px 0 10px; }
@media (prefers-reduced-motion: reduce) { .progress .bar span { transition: none; } }
</style>
</head>

  function viewPlan(app) {
    app.appendChild(h('header', { class: 'head' }, h('h1', { text: t('planTitle') }), h('p', { text: t('planSub') })));
    if (planMsg) app.appendChild(h('p', { class: 'added', role: 'status', style: 'margin:14px 0 0', text: planMsg }));
    viewWeekPanel(app);

    var form = h('form', { class: 'card', style: 'margin-top:18px', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      var title = draft.title.trim();
      if (!title) { draft.error = t('errName'); render(); return; }
      if (!draft.days.length && !draft.later) { draft.error = t('errDays'); render(); return; }
      var url = draft.url.trim() ? safeUrl(draft.url) : '';
      if (draft.url.trim() && !url) { draft.error = t('errLink'); render(); return; }
      var fields = { title: title, url: url, kind: draft.kind, lang: draft.lang, topic: draft.topic, days: draft.later ? [] : draft.days.slice().sort(), later: !!draft.later };
      if (draft.editing) {
        var it = state.items.filter(function (x) { return x.id === draft.editing; })[0];
        if (it) Object.keys(fields).forEach(function (k) { it[k] = fields[k]; });
      } else {
        fields.id = uid(); state.items.push(fields);
      }
      save();
      draft = newDraft(draft);
      render();
    } });
    form.appendChild(h('h2', { text: draft.editing ? t('editTitle') : t('planAddTitle') }));
    form.appendChild(h('label', { class: 'f' }, t('fName'),
      h('input', { type: 'text', dir: 'auto', value: draft.title, placeholder: t('fNamePh'), oninput: function (e) { draft.title = e.target.value; } })));
    form.appendChild(h('label', { class: 'f' }, t('fLink'),
      h('input', { type: 'url', dir: 'ltr', inputmode: 'url', value: draft.url, placeholder: 'https://', oninput: function (e) { draft.url = e.target.value; } })));

    var kindSel = h('select', { onchange: function (e) { draft.kind = e.target.value; } });
    Object.keys(KIND_OK).forEach(function (k) {
      var o = h('option', { value: k, text: t('k_' + k) }); if (k === draft.kind) o.selected = true; kindSel.appendChild(o);
    });
    form.appendChild(h('label', { class: 'f' }, t('fKind'), kindSel));

    var langSel = h('select', { onchange: function (e) { draft.lang = e.target.value; } });
    langSel.appendChild(h('option', { value: '', text: t('fLangNone') }));
    Object.keys(LANGS).forEach(function (k) {
      var o = h('option', { value: k, text: LANGS[k] }); if (k === draft.lang) o.selected = true; langSel.appendChild(o);
    });
    form.appendChild(h('label', { class: 'f' }, t('fLang'), langSel));

    var topicSel = h('select', { onchange: function (e) { draft.topic = e.target.value; } });
    topicSel.appendChild(h('option', { value: '', text: t('fNoTopic') }));
    state.topics.forEach(function (tp) {
      var o = h('option', { value: tp.id, text: tp.name }); if (tp.id === draft.topic) o.selected = true; topicSel.appendChild(o);
    });
    form.appendChild(h('label', { class: 'f' }, t('fTopic'), topicSel));

    var fs = h('fieldset', null, h('legend', { text: t('fDays') }));
    var chips = h('div', { class: 'chips' });
    days().forEach(function (d, i) {
      var on = draft.days.indexOf(i) !== -1;
      chips.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': on ? 'true' : 'false', onclick: function () {
        toggle(draft.days, i); draft.later = false; render();
      } }, d));
    });
    var all = draft.days.length === 7;
    chips.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': all ? 'true' : 'false', onclick: function () {
      draft.days = all ? [] : [0, 1, 2, 3, 4, 5, 6]; draft.later = false; render();
    } }, t('everyDay')));
    chips.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': draft.later ? 'true' : 'false', onclick: function () {
      draft.later = !draft.later; if (draft.later) draft.days = []; render();
    } }, t('noDay')));
    fs.appendChild(chips);
    form.appendChild(fs);

    form.appendChild(h('p', { class: 'err', role: 'alert', text: draft.error }));
    var facts = h('div', { class: 'acts' });
    facts.appendChild(h('button', { type: 'submit', class: 'btn solid' }, draft.editing ? t('saveChanges') : t('addToPlan')));
    if (draft.editing) facts.appendChild(h('button', { type: 'button', class: 'btn', onclick: function () { draft = newDraft(); render(); } }, t('cancel')));
    form.appendChild(facts);
    app.appendChild(form);

    var today = new Date().getDay();
    for (var n = 0; n < 7; n++) {
      var d = (today + n) % 7;
      app.appendChild(h('h2', { class: 'sec' }, t('dayHeader', days()[d]), n === 0 ? h('span', { class: 'tag-today', text: t('today') }) : null));
      var its = state.items.filter(function (i) { return i.days.indexOf(d) !== -1; });
      if (!its.length) { app.appendChild(h('p', { class: 'none-line', text: t('emptyLine') })); continue; }
      var ul = h('ul', { class: 'list' });
      its.forEach(function (it) { ul.appendChild(itemRow(it, { edit: true, remove: true })); });
      app.appendChild(ul);
    }

    app.appendChild(h('h2', { class: 'sec' }, t('laterTitle')));
    var laters = state.items.filter(function (i) { return i.later; });
    if (!laters.length) app.appendChild(h('p', { class: 'none-line', text: t('laterEmpty') }));
    else {
      var lul = h('ul', { class: 'list' });
      laters.forEach(function (it) { lul.appendChild(itemRow(it, { edit: true, remove: true })); });
      app.appendChild(lul);
    }
    if (state.items.length) app.appendChild(h('p', { class: 'note', text: t('delNote') }));
  }

  /* ---------- suggestions view (built-in list + free search) ---------- */
  function addSuggestion(r, later) {
    if (!later && !r.days.length) return;
    var tp = topicByName(catName(r), true);
    state.items.push(itemFromSuggestion(r, tp ? tp.id : '', later ? [] : r.days.slice().sort(), later));
    r.added = later ? 'later' : 'plan'; r.open = false; save(); render();
  }

  function viewSuggest(app) {
    app.appendChild(h('header', { class: 'head' }, h('h1', { text: t('sTitle') }), h('p', { text: t('sSub') })));
    var card = h('div', { class: 'card', style: 'margin-top:18px' });
    var cf = h('fieldset', null, h('legend', { text: t('sCats') }));
    var cc = h('div', { class: 'chips' });
    cc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': sug.cats.length ? 'false' : 'true', onclick: function () { sug.cats = []; render(); } }, t('catAll')));
    Object.keys(LIB_CATS).forEach(function (k) {
      cc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': sug.cats.indexOf(k) !== -1 ? 'true' : 'false', onclick: function () { toggle(sug.cats, k); render(); } }, LIB_CATS[k][state.ui]));
    });
    cf.appendChild(cc); card.appendChild(cf);
    var lf = h('fieldset', null, h('legend', { text: t('sLangs') }));
    var lc = h('div', { class: 'chips' });
    Object.keys(LANGS).forEach(function (k) {
      lc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': state.langs.indexOf(k) !== -1 ? 'true' : 'false', onclick: function () { toggle(state.langs, k); save(); render(); } }, LANGS[k]));
    });
    lf.appendChild(lc); card.appendChild(lf);
    var kf = h('fieldset', null, h('legend', { text: t('sKinds') }));
    var kc = h('div', { class: 'chips' });
    SKINDS.forEach(function (k) {
      kc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': sug.kinds.indexOf(k) !== -1 ? 'true' : 'false', onclick: function () { toggle(sug.kinds, k); render(); } }, t('kp_' + k)));
    });
    kf.appendChild(kc); card.appendChild(kf);
    app.appendChild(card);

    var res = LIB.filter(function (x) {
      return (!sug.cats.length || sug.cats.indexOf(x.cat) !== -1) && state.langs.indexOf(x.lang) !== -1 && sug.kinds.indexOf(x.kind) !== -1;
    });
    if (!res.length) {
      app.appendChild(h('p', { class: 'status', text: t('sLibNone') }));
    } else {
      var ul = h('ul', { class: 'list', style: 'margin-top:20px' });
      res.forEach(function (r) {
        var li = h('li', { class: 'sg' });
        li.appendChild(h('div', { class: 'name', text: r.title }));
        li.appendChild(h('div', { class: 'meta' },
          r.creator ? h('span', { text: r.creator }) : null,
          h('span', { text: t('k_' + r.kind) }),
          (r.lang && LANGS[r.lang]) ? h('span', { class: 'tag', text: LANGS[r.lang] }) : null));
        if (whyOf(r)) li.appendChild(h('p', { class: 'why', text: whyOf(r) }));
        var a = h('div', { class: 'acts' });
        links(r).forEach(function (l) {
          a.appendChild(h('a', { class: 'btn small', href: l[1], target: '_blank', rel: 'noopener noreferrer', onclick: function () {
            logHistory({ title: r.creator ? r.title + ' - ' + r.creator : r.title, url: l[1], kind: r.kind, lang: r.lang }, 'open', catName(r));
          } }, l[0]));
        });
        if (r.added) a.appendChild(h('span', { class: 'added', text: r.added === 'later' ? t('savedLater') : t('added') }));
        else {
          a.appendChild(h('button', { type: 'button', class: 'btn small solid', 'aria-expanded': r.open ? 'true' : 'false', onclick: function () { r.open = !r.open; render(); } }, t('addToPlan')));
          a.appendChild(h('button', { type: 'button', class: 'btn small', onclick: function () { addSuggestion(r, true); } }, t('saveLater')));
        }
        li.appendChild(a);
        if (r.open && !r.added) {
          var dc = h('div', { class: 'chips' });
          days().forEach(function (d, i) {
            dc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': r.days.indexOf(i) !== -1 ? 'true' : 'false', onclick: function () { toggle(r.days, i); render(); } }, d));
          });
          li.appendChild(dc);
          li.appendChild(h('div', { class: 'acts' }, h('button', { type: 'button', class: 'btn small solid', disabled: !r.days.length, onclick: function () { addSuggestion(r, false); } }, t('add'))));
        }
        ul.appendChild(li);
      });
      app.appendChild(ul);
    }

    var free = h('form', { class: 'card', style: 'margin-top:20px', novalidate: true, onsubmit: function (e) {
      e.preventDefault();
      var q = sug.free.trim();
      if (q) openUrl('https://www.youtube.com/results?search_query=' + encodeURIComponent(q));
    } });
    free.appendChild(h('h2', { text: t('sFree') }));
    free.appendChild(h('input', { type: 'text', dir: 'auto', value: sug.free, placeholder: t('sFreePh'), 'aria-label': t('sFree'), oninput: function (e) { sug.free = e.target.value; } }));
    free.appendChild(h('div', { class: 'acts' },
      h('button', { type: 'button', class: 'btn small solid', onclick: function () { var q = sug.free.trim(); if (q) openUrl('https://www.youtube.com/results?search_query=' + encodeURIComponent(q)); } }, t('sFreeYT')),
      h('button', { type: 'button', class: 'btn small', onclick: function () { var q = sug.free.trim(); if (q) openUrl('https://podcasts.apple.com/search?term=' + encodeURIComponent(q)); } }, t('sFreeAP'))));
    app.appendChild(free);
    app.appendChild(h('p', { class: 'note', text: t('sLibNote') }));
  }

  /* ---------- topics, backup, interface language ---------- */
  function doBackup() {
    var data = JSON.stringify({ app: 'galila-hakhama', version: 2, topics: state.topics, items: state.items, done: state.done, langs: state.langs, history: state.history });
    try {
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'galila-hakhama-backup-' + dateKey(new Date()) + '.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      backupMsg = t('bkSaved');
    } catch (e) { backupMsg = t('bkFail'); }
    render();
  }
  function doRestore(file) {
    if (!file) return;
    var rd = new FileReader();
    rd.onerror = function () { backupMsg = t('rsRead'); render(); };
    rd.onload = function () {
      try {
        var p = JSON.parse(String(rd.result));
        if (!p || p.app !== 'galila-hakhama' || !Array.isArray(p.items) || !Array.isArray(p.topics)) throw new Error('bad');
        var topics = p.topics.filter(function (x) { return x && typeof x === 'object'; }).map(function (x) {
          return { id: String(x.id || uid()), name: String(x.name || '').slice(0, 100), color: /^#[0-9a-fA-F]{6}$/.test(x.color) ? x.color : COLORS[0] };
        });
        var items = p.items.filter(function (it) { return it && typeof it === 'object'; }).map(function (it) {
          var dl = (Array.isArray(it.days) ? it.days : []).filter(function (d) { return d === 0 || d === 1 || d === 2 || d === 3 || d === 4 || d === 5 || d === 6; });
          return {
            id: String(it.id || uid()), title: String(it.title || '').slice(0, 300),
            url: it.url ? safeUrl(String(it.url)) : '', kind: KIND_OK[it.kind] ? it.kind : 'other',
            lang: LANGS[it.lang] ? it.lang : '', topic: String(it.topic || ''), days: dl, later: !!it.later && !dl.length
          };
        });
        var done = {};
        if (p.done && typeof p.done === 'object') {
          Object.keys(p.done).forEach(function (k) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(p.done[k])) done[k] = p.done[k].map(String);
          });
        }
        var langs = (Array.isArray(p.langs) ? p.langs : []).filter(function (l) { return LANGS[l]; });
        var hist = (Array.isArray(p.history) ? p.history : []).filter(function (x) { return x && typeof x === 'object' && typeof x.ts === 'number'; }).slice(0, 500).map(function (x) {
          return { id: String(x.id || uid()), title: String(x.title || '').slice(0, 300), url: x.url ? safeUrl(String(x.url)) : '', kind: KIND_OK[x.kind] ? x.kind : 'other', lang: LANGS[x.lang] ? x.lang : '', topic: String(x.topic || '').slice(0, 100), action: x.action === 'done' ? 'done' : 'open', ts: x.ts };
        });
        state = { topics: topics, items: items, done: done, langs: langs.length ? langs : ['he'], ui: state.ui, history: hist, welcomed: true };
        draft = newDraft(); armed = null; pick = { id: null, msg: '' }; save();
        backupMsg = t('rsDone');
      } catch (e) {
        backupMsg = t('rsBad');
      }
      render();
    };
    rd.readAsText(file);
  }

  function viewTopics(app) {
    app.appendChild(h('header', { class: 'head' }, h('h1', { text: t('tTitle') }), h('p', { text: t('tSub') })));

    var input = h('input', { type: 'text', dir: 'auto', placeholder: t('tNewPh'), 'aria-label': t('tNewPh') });
    function addTopic(name) {
      name = (name || '').trim();
      if (!name) return;
      if (state.topics.some(function (x) { return x.name === name; })) return;
      state.topics.push({ id: uid(), name: name, color: COLORS[state.topics.length % COLORS.length] });
      save(); render();
    }
    app.appendChild(h('form', { class: 'topic-add', style: 'margin-top:18px', onsubmit: function (e) { e.preventDefault(); addTopic(input.value); } },
      input, h('button', { type: 'submit', class: 'btn solid' }, t('tAdd'))));

    var left = SUGGESTIONS[state.ui].filter(function (s) { return !state.topics.some(function (x) { return x.name === s; }); });
    if (left.length) {
      var chips = h('div', { class: 'chips' });
      left.forEach(function (s) { chips.appendChild(h('button', { type: 'button', class: 'chip', onclick: function () { addTopic(s); } }, '+ ' + s)); });
      app.appendChild(h('div', { class: 'sugg' }, h('p', { text: t('tSugg') }), chips));
    }

    if (state.topics.length) {
      var ul = h('ul', { class: 'list', style: 'margin-top:20px' });
      state.topics.forEach(function (tp) {
        var count = state.items.filter(function (i) { return i.topic === tp.id; }).length;
        var a = armed === 'topic:' + tp.id;
        ul.appendChild(h('li', { class: 'row' },
          h('span', { class: 'dot', style: 'background:' + tp.color + ';width:14px;height:14px' }),
          h('div', { class: 'body' }, h('div', { class: 'title', text: tp.name }), h('div', { class: 'meta', text: count ? t('count', count) : t('noItems') })),
          h('button', { type: 'button', class: 'btn small danger' + (a ? ' armed' : ''), onclick: function () {
            if (a) {
              state.topics = state.topics.filter(function (x) { return x.id !== tp.id; });
              state.items = state.items.filter(function (x) { return x.topic !== tp.id; });
              if (draft.topic === tp.id) draft.topic = '';
              armed = null; save();
            } else armed = 'topic:' + tp.id;
            render();
          } }, a ? (count ? t('delWith', count) : t('sure')) : t('del'))
        ));
      });
      app.appendChild(ul);
    }

    app.appendChild(h('h2', { class: 'sec' }, t('uiTitle')));
    var uc = h('div', { class: 'chips' });
    Object.keys(LANGS).forEach(function (k) {
      uc.appendChild(h('button', { type: 'button', class: 'chip', 'aria-pressed': state.ui === k ? 'true' : 'false', onclick: function () { state.ui = k; save(); applyLang(); render(); } }, LANGS[k]));
    });
    app.appendChild(uc);

    app.appendChild(h('h2', { class: 'sec' }, t('bkTitle')));
    app.appendChild(h('p', { class: 'none-line', text: t('bkText') }));
    var fi = h('input', { type: 'file', accept: '.json,application/json', style: 'display:none', 'aria-hidden': 'true', tabindex: '-1', onchange: function (e) { doRestore(e.target.files && e.target.files[0]); } });
    var bacts = h('div', { class: 'acts', style: 'margin-top:12px' });
    bacts.appendChild(h('button', { type: 'button', class: 'btn', onclick: doBackup }, t('bkSave')));
    bacts.appendChild(h('button', { type: 'button', class: 'btn', onclick: function () { fi.click(); } }, t('bkRestore')));
    app.appendChild(bacts);
    app.appendChild(fi);
    if (backupMsg) app.appendChild(h('p', { class: 'status', role: 'status', text: backupMsg }));
    app.appendChild(h('div', { class: 'acts', style: 'margin-top:24px' }, h('button', { type: 'button', class: 'btn small', onclick: function () { view = 'welcome'; render(); window.scrollTo(0, 0); } }, t('w_about'))));
  }

  function langBar() {
    var bar = h('div', { class: 'langbar', role: 'group', 'aria-label': 'Language' });
    Object.keys(LANGS).forEach(function (k) {
      bar.appendChild(h('button', { type: 'button', class: 'chip small', lang: k, 'aria-pressed': state.ui === k ? 'true' : 'false', onclick: function () { state.ui = k; save(); applyLang(); render(); } }, LANGS[k]));
    });
    return bar;
  }

  function render() {
    var app = document.getElementById('app');
    var y = window.scrollY;
    app.textContent = '';
    document.querySelector('nav.tabs').style.display = view === 'welcome' ? 'none' : '';
    if (view !== 'welcome') app.appendChild(langBar());
    if (view === 'welcome') viewWelcome(app);
    else if (view === 'today') viewToday(app);
    else if (view === 'plan') viewPlan(app);
    else if (view === 'suggest') viewSuggest(app);
    else if (view === 'history') viewHistory(app);
    else viewTopics(app);
    renderTabs();
    window.scrollTo(0, y);
  }

  applyLang();
  render();
  if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
