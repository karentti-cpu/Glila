<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="r"><rect width="100" height="100" rx="22"/></clipPath>
    <g id="hand" transform="rotate(-16 70 80)">
      <rect x="59" y="49" width="11" height="36" rx="5.5"/>
      <rect x="69" y="64" width="10" height="20" rx="5"/>
      <rect x="78" y="67" width="10" height="18" rx="5"/>
      <rect x="87" y="70" width="9" height="16" rx="4.5"/>
      <rect x="57" y="74" width="40" height="34" rx="12"/>
      <rect x="49" y="83" width="18" height="11" rx="5.5" transform="rotate(-48 60 88)"/>
    </g>
  </defs>
  <g clip-path="url(#r)">
    <rect width="100" height="100" fill="#1F6F6A"/>
    <rect x="14" y="14" width="54" height="9" rx="4.5" fill="#fff" opacity=".32"/>
    <rect x="14" y="29" width="54" height="9" rx="4.5" fill="#fff" opacity=".32"/>
    <rect x="9" y="44" width="68" height="16" rx="8" fill="#F2B233"/>
    <path d="M21 52l4 4 8-8" stroke="#1F6F6A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="14" y="66" width="38" height="9" rx="4.5" fill="#fff" opacity=".32"/>
    <rect x="14" y="81" width="30" height="9" rx="4.5" fill="#fff" opacity=".32"/>
    <!-- scroll marks beside the fingertip -->
    <path d="M53 33 v-8 M50 28 l3 -3 3 3" stroke="#F2B233" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the hand: a dark outline under a white fill makes one clean shape -->
    <use href="#hand" fill="#123F3C" stroke="#123F3C" stroke-width="6" stroke-linejoin="round"/>
    <use href="#hand" fill="#FFFFFF"/>
    <path d="M62.5 56 h6" stroke="#E7DCC8" stroke-width="1.6" stroke-linecap="round" transform="rotate(-16 70 80)"/>
  </g>
</svg>
